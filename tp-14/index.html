<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lista de Contactos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-4">
    <h1>Lista de Contactos</h1>

    <div class="card">
        <div class="card-body">

            <h2>Contactos</h2>

            <input type="text" id="buscador" class="form-control mb-3" placeholder="Buscar contacto...">

            <div class="mb-3">
                <button class="btn btn-secondary btn-sm" onclick="ordenarPor('nombre')">Ordenar por Nombre</button>
                <button class="btn btn-secondary btn-sm" onclick="ordenarPor('apellido')">Ordenar por Apellido</button>
                <button class="btn btn-warning btn-sm" onclick="verFavoritos()">Ver Favoritos</button>
                <button class="btn btn-dark btn-sm" onclick="verTodos()">Ver Todos</button>
                <button class="btn btn-danger btn-sm" onclick="eliminarSeleccionados()">Eliminar Seleccionados</button>
            </div>

            <ul id="lista-contactos" class="list-group mb-3"></ul>

            <hr>

            <h2>Nuevo Contacto</h2>
            <form id="form-producto">
                <div class="mb-2">
                    <input type="text" class="form-control" id="input-nombre" placeholder="Nombre">
                </div>
                <div class="mb-2">
                    <input type="text" class="form-control" id="input-apellido" placeholder="Apellido">
                </div>
                <div class="mb-2">
                    <input type="text" class="form-control" id="input-telefono" placeholder="Teléfono">
                </div>
                <button class="btn btn-primary" type="submit">Agregar Contacto</button>
            </form>

        </div>
    </div>
</div>

<script>
let contactos = JSON.parse(localStorage.getItem("contactos")) || [
    { nombre: 'Juan', apellido: 'Perez', telefono: '123', favorito: false }
];

let mostrarSoloFavoritos = false;

function mostrarListado() {
    const lista = document.getElementById("lista-contactos");
    const filtro = document.getElementById("buscador").value.toLowerCase();

    lista.innerHTML = "";

    contactos
        .filter(c => {
            if (mostrarSoloFavoritos && !c.favorito) return false;

            return (
                c.nombre.toLowerCase().includes(filtro) ||
                c.apellido.toLowerCase().includes(filtro) ||
                c.telefono.includes(filtro)
            );
        })
        .forEach((c, index) => {

            const li = document.createElement("li");
            li.className = "list-group-item d-flex justify-content-between align-items-center";

            // TEXTO
            const span = document.createElement("span");
            span.textContent = `${c.nombre} ${c.apellido} - ${c.telefono}`;

            if (c.favorito) {
                span.style.fontWeight = "bold";
                span.style.color = "gold";
            }

            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.className = "me-2";
            checkbox.onchange = () => c.seleccionado = checkbox.checked;

            const div = document.createElement("div");

            const btnFav = document.createElement("button");
            btnFav.className = "btn btn-sm btn-warning me-1";
            btnFav.textContent = "★";
            btnFav.onclick = () => {
                c.favorito = !c.favorito;
                guardar();
            };

            const btnEditar = document.createElement("button");
            btnEditar.className = "btn btn-sm btn-info me-1";
            btnEditar.textContent = "✏️";
            btnEditar.onclick = () => editarContacto(index);

            const btnEliminar = document.createElement("button");
            btnEliminar.className = "btn btn-sm btn-danger";
            btnEliminar.textContent = "X";
            btnEliminar.onclick = () => eliminarContacto(index);

            div.appendChild(btnFav);
            div.appendChild(btnEditar);
            div.appendChild(btnEliminar);

            li.prepend(checkbox);
            li.appendChild(span);
            li.appendChild(div);

            lista.appendChild(li);
        });

    localStorage.setItem("contactos", JSON.stringify(contactos));
}

function agregarContacto(nombre, apellido, telefono) {
    if (!nombre || !apellido || !telefono) return;

    contactos.push({
        nombre,
        apellido,
        telefono,
        favorito: false
    });

    guardar();
}

function eliminarContacto(index) {
    contactos.splice(index, 1);
    guardar();
}

function eliminarSeleccionados() {
    contactos = contactos.filter(c => !c.seleccionado);
    guardar();
}

function editarContacto(index) {
    const nuevoNombre = prompt("Nombre:", contactos[index].nombre);
    const nuevoApellido = prompt("Apellido:", contactos[index].apellido);
    const nuevoTelefono = prompt("Teléfono:", contactos[index].telefono);

    if (nuevoNombre && nuevoApellido && nuevoTelefono) {
        contactos[index].nombre = nuevoNombre;
        contactos[index].apellido = nuevoApellido;
        contactos[index].telefono = nuevoTelefono;
        guardar();
    }
}

function ordenarPor(campo) {
    contactos.sort((a, b) => a[campo].localeCompare(b[campo]));
    guardar();
}

function verFavoritos() {
    mostrarSoloFavoritos = true;
    mostrarListado();
}

function verTodos() {
    mostrarSoloFavoritos = false;
    mostrarListado();
}

function guardar() {
    localStorage.setItem("contactos", JSON.stringify(contactos));
    mostrarListado();
}

function handlerFormulario(e) {
    e.preventDefault();

    const nombre = document.getElementById("input-nombre").value;
    const apellido = document.getElementById("input-apellido").value;
    const telefono = document.getElementById("input-telefono").value;

    document.getElementById("input-nombre").value = "";
    document.getElementById("input-apellido").value = "";
    document.getElementById("input-telefono").value = "";

    agregarContacto(nombre, apellido, telefono);
}

document.querySelector('form').addEventListener('submit', handlerFormulario);
document.getElementById("buscador").addEventListener("input", mostrarListado);

mostrarListado();
</script>

</body>
</html>
